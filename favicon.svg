<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Card Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Outer Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4" opacity="0.6" />

  <!-- Shield Base -->
  <path d="M256 72 C336 72 400 112 400 112 V248 C400 348 312 416 256 440 C200 416 112 348 112 248 V112 C112 112 176 72 256 72 Z"
        fill="url(#shieldGrad)" filter="url(#glow)" />

  <!-- Inner Shield Accent -->
  <path d="M256 96 C320 96 376 128 376 128 V240 C376 324 300 384 256 408 C212 384 136 324 136 240 V128 C136 128 192 96 256 96 Z"
        fill="#0f172a" opacity="0.4" />

  <!-- Star Badge -->
  <path d="M256 148 L278 202 L336 206 L292 244 L306 300 L256 270 L206 300 L220 244 L176 206 L234 202 Z"
        fill="url(#accentGrad)" />

  <!-- Verified Checkmark overlay -->
  <path d="M220 325 L248 355 L300 295"
        fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
</svg>
